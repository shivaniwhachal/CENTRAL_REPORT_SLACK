name: Daily VINI report

on:
  schedule:
    # 6:00 AM IST sends the picture. 7:00 AM IST checks.
    # The 7:00 run uploads only when today's picture is not already recorded.
    - cron: '30 0 * * *'
    - cron: '30 1 * * *'
  workflow_dispatch:

concurrency:
  group: central-daily-vini-report
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: One post per morning
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DAY=$(TZ=Asia/Kolkata date +%F)
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Check only. No picture will be sent."
            echo "mode=check" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NAME="central-sent-$DAY"
          if ! FOUND=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" --jq "[.artifacts[] | select(.name==\"$NAME\" and .expired==false)] | length"); then
            echo "Could not check the sent record. Not posting."
            echo "mode=check" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$FOUND" != "0" ]; then
            echo "Already posted $DAY. Check only. Not sending again."
            echo "mode=check" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 1 * * *" ]; then
            echo "7:00 AM check. Today's picture is not recorded, so this run may send it once."
            echo "mode=send" >> "$GITHUB_OUTPUT"
          else
            echo "6:00 AM send."
            echo "mode=send" >> "$GITHUB_OUTPUT"
          fi

      - name: Check only
        if: steps.gate.outputs.mode == 'check'
        run: echo "Check only. Nothing was sent."

      - name: Checkout
        if: steps.gate.outputs.mode == 'send'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.gate.outputs.mode == 'send'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        if: steps.gate.outputs.mode == 'send'
        run: pip install -r requirements.txt

      - name: Send the report
        if: steps.gate.outputs.mode == 'send'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_NOTIFY_USER_ID: ${{ secrets.SLACK_NOTIFY_USER_ID }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          POST_TO_CENTRAL: ${{ secrets.POST_TO_CENTRAL }}
        run: python -m central_analytics_report --scheduled

      - name: Check the sent marker
        id: marker
        if: steps.gate.outputs.mode == 'send' && success()
        run: |
          if compgen -G "logs/central-sent-*" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record that today was sent
        if: steps.gate.outputs.mode == 'send' && steps.marker.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: central-sent-${{ steps.gate.outputs.day }}
          path: logs/
          retention-days: 14
          if-no-files-found: error

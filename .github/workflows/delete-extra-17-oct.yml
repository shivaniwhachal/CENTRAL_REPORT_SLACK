name: Delete extra 17 Oct reports

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the extra channel pictures
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          python3 << 'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          TOKEN = os.environ["SLACK_BOT_TOKEN"]
          CHANNEL = os.environ.get("SLACK_CHANNEL_ID", "").strip() or "C0AULQ5F2D6"
          KEEP = "F0C9XEP2V8E"
          EXTRA = ["F0C9ZB6P0RY", "F0C9XLBQ014", "F0CA1KZTAQ1", "F0C9JGVN3AB"]
          TITLE = "Daily VINI report 16 Oct"

          def api(method, fields):
              body = urllib.parse.urlencode(fields).encode()
              request = urllib.request.Request(
                  f"https://slack.com/api/{method}",
                  data=body,
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Content-Type": "application/x-www-form-urlencoded",
                  },
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  payload = json.loads(response.read().decode())
              print(f"{method} ok={payload.get('ok')} error={payload.get('error')}")
              return payload

          history = api("conversations.history", {"channel": CHANNEL, "limit": "100"})
          messages = history.get("messages") or []
          matches = []
          for message in messages:
              text = message.get("text") or ""
              file_ids = [item.get("id") for item in (message.get("files") or []) if item.get("id")]
              names = " ".join(
                  (item.get("title") or "") + " " + (item.get("name") or "")
                  for item in (message.get("files") or [])
              )
              if TITLE in text or TITLE in names or any(file_id in EXTRA or file_id == KEEP for file_id in file_ids):
                  matches.append(message)
          matches.sort(key=lambda message: float(message.get("ts") or 0))
          print(f"matching messages={len(matches)}")
          delete_ts = []
          for index, message in enumerate(matches):
              file_ids = [item.get("id") for item in (message.get("files") or [])]
              print(f"message {index} ts={message.get('ts')} files={file_ids}")
              if index == 0 and (KEEP in file_ids or TITLE in (message.get("text") or "")):
                  print("keeping the earliest")
                  continue
              if message.get("ts"):
                  delete_ts.append(message["ts"])

          for ts in delete_ts:
              api("chat.delete", {"channel": CHANNEL, "ts": ts})

          for file_id in EXTRA:
              api("files.delete", {"file": file_id})
          print("done. no picture was uploaded.")
          PY
